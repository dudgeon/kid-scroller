name: SameAge

options:
  bundleIdPrefix: org.dudgeon
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

packages:
  SameAgeCore:
    path: Packages/SameAgeCore

settings:
  base:
    DEVELOPMENT_TEAM: R39EF29X3Y
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SameAge:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SameAgeCore
        product: SameAgeCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SameAge
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        # Mandatory since the iOS 11 SDK; App Store Connect rejects uploads without it.
        # Must match the asset-catalog icon set name below.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # R: iPhone portrait only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Required before any PhotoKit access; shown verbatim in the system prompt.
        NSPhotoLibraryUsageDescription: >-
          SameAge reads the two albums you choose so it can show your kids' photos
          side by side, lined up by how old each of them was.
        # Contacts is optional — only used to prefill a birthday during onboarding (R9).
        NSContactsUsageDescription: >-
          SameAge can prefill a birthday from your Contacts. You can always type it in
          instead, and change it later in Settings.
        # Skips the export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dudgeon.sameage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  SameAgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SameAgeTests
    dependencies:
      - target: SameAge
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SameAge:
    build:
      targets:
        SameAge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SameAgeTests
    archive:
      config: Release
